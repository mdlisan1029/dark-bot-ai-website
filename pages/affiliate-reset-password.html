<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Set Password — Dark Bot AI</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body class="portal-shell">
  <main class="portal-main">
    <div class="container">
      <div class="portal-card">
        <div class="portal-brand">
          <div class="portal-kicker">DARK BOT AI · AFFILIATE PORTAL</div>
          <h1 class="portal-title">Set your password</h1>
          <p class="portal-subtitle">Use this page after the password recovery/invitation flow opens in your browser.</p>
        </div>

        <form id="password-form" class="portal-form" novalidate>
          <label>
            New password
            <input id="new-password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
          </label>
          <label>
            Confirm password
            <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Repeat the password">
          </label>
          <button id="save-password-btn" class="btn btn-primary" type="submit">Save password</button>
          <div id="password-message" class="portal-message" role="status" aria-live="polite"></div>
        </form>

        <div class="portal-divider"></div>
        <div class="portal-links">
          <a href="affiliate-login.html">← Back to affiliate login</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase-config.js"></script>
  <script src="../js/affiliate-auth.js"></script>
  <script>
    DarkBotAffiliateAuth.initResetPage({
      formId: 'password-form',
      passwordId: 'new-password',
      confirmPasswordId: 'confirm-password',
      buttonId: 'save-password-btn',
      messageId: 'password-message',
      redirectPath: 'affiliate-dashboard.html'
    });
  </script>
</body>
</html>
